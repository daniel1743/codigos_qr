<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      /*
 * CSS ISOLATION
 * Every rule below is namespaced under `.pts-*`. No element selectors,
 * no resets, no global variables — safe to drop into any host application.
 */

      .pts-anim-fade,
      .pts-anim-slide,
      .pts-anim-scale,
      .pts-anim-rise,
      .pts-anim-slide-up,
      .pts-anim-scale-in {
        animation-duration: var(--pts-motion-duration, 0.5s);
        animation-fill-mode: both;
        animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
      }
      .pts-anim-fade {
        animation-name: pts-fade;
      }
      .pts-anim-slide {
        animation-name: pts-slide;
      }
      .pts-anim-scale {
        animation-name: pts-scale;
      }
      .pts-anim-rise {
        animation-name: pts-rise;
      }
      .pts-anim-slide-up {
        animation-name: pts-slide-up;
      }
      .pts-anim-scale-in {
        animation-name: pts-scale-in;
      }

      @keyframes pts-fade {
        from {
          opacity: 0;
        }
      }
      @keyframes pts-slide {
        from {
          opacity: 0;
          transform: translateX(-10px);
        }
      }
      @keyframes pts-scale {
        from {
          opacity: 0;
          transform: scale(0.97);
        }
      }
      @keyframes pts-rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
      }
      @keyframes pts-slide-up {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
      }
      @keyframes pts-scale-in {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
      }

      .pts-hoverable {
        transition:
          transform 0.18s cubic-bezier(0.22, 1, 0.36, 1),
          box-shadow 0.18s ease,
          filter 0.18s ease;
      }
      .pts-hoverable:hover {
        transform: translateY(-2px);
        filter: brightness(1.03);
      }

      .pts-page a {
        color: inherit;
        text-decoration: none;
        display: block;
      }

      .pts-block {
        outline: none;
        border-radius: 12px;
        transition: box-shadow 0.15s ease;
        cursor: default;
      }
      .pts-block:hover {
        box-shadow: 0 0 0 1px color-mix(in oklab, currentColor 22%, transparent);
      }
      .pts-block--selected {
        box-shadow: 0 0 0 1.5px var(--pts-accent, #6d5efc);
      }
      .pts-block:focus-visible {
        box-shadow: 0 0 0 2px var(--pts-accent, #6d5efc);
      }

      .pts-block__chrome {
        position: absolute;
        top: -11px;
        left: 6px;
        right: 6px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        pointer-events: none;
        z-index: 5;
      }
      .pts-block__label {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        padding: 2px 7px 2px 4px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: capitalize;
        color: #fff;
        background: var(--pts-accent, #6d5efc);
        pointer-events: none;
      }
      .pts-block__actions {
        display: inline-flex;
        gap: 2px;
        padding: 2px;
        border-radius: 999px;
        background: rgba(20, 20, 24, 0.92);
        backdrop-filter: blur(8px);
        pointer-events: auto;
      }
      .pts-block__actions button {
        display: grid;
        place-items: center;
        width: 22px;
        height: 22px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: #f5f5f7;
        cursor: pointer;
        transition: background 0.12s ease;
      }
      .pts-block__actions button:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.16);
      }
      .pts-block__actions button:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }

      /* Studio shell scrollbars */
      .pts-scroll {
        scrollbar-width: thin;
        scrollbar-color: color-mix(in oklab, currentColor 25%, transparent) transparent;
      }
      .pts-scroll::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      .pts-scroll::-webkit-scrollbar-thumb {
        background: color-mix(in oklab, currentColor 22%, transparent);
        border-radius: 999px;
      }

      .pts-mobile-sheet-scroll {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .pts-mobile-sheet-scroll::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }

      /* ---- Phase 1 workspace surfaces ---- */
      .pts-desktop-panel {
        height: 100%;
        min-height: 0;
        min-width: 0;
        overflow: hidden;
        flex: 0 0 auto;
      }
      .pts-desktop-panel--collapsed {
        width: 44px;
      }
      .pts-panel-rail {
        display: flex;
        height: 100%;
        width: 44px;
        align-items: flex-start;
        justify-content: center;
        padding-top: 0.75rem;
      }
      .pts-panel-rail--right {
        margin-left: auto;
      }
      .pts-canvas-workspace {
        overscroll-behavior: contain;
      }

      .pts-power-viewport {
        scrollbar-width: none;
      }
      .pts-power-viewport::-webkit-scrollbar {
        display: none;
      }

      @media (min-width: 1024px) {
        .pts-power-viewport {
          scrollbar-width: thin;
          scrollbar-color: color-mix(in oklab, currentColor 25%, transparent) transparent;
        }
        .pts-power-viewport::-webkit-scrollbar {
          display: block;
        }
      }
      .pts-power-viewport--pan-ready {
        cursor: grab;
      }
      .pts-power-viewport--pan-ready .pts-power-camera-layer,
      .pts-power-viewport--panning .pts-power-camera-layer {
        pointer-events: none;
      }
      .pts-power-viewport--panning {
        cursor: grabbing;
        user-select: none;
      }
      .pts-power-camera-layer {
        will-change: transform;
      }

      @media (prefers-reduced-motion: reduce) {
        .pts-desktop-panel,
        .pts-canvas-workspace {
          scroll-behavior: auto;
        }
      }

      /* ---- Hover interaction presets ---- */
      .pts-hover-lift {
        transition:
          transform 0.2s cubic-bezier(0.22, 1, 0.36, 1),
          box-shadow 0.2s ease;
      }
      .pts-hover-lift:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      }

      .pts-hover-scale {
        transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .pts-hover-scale:hover {
        transform: scale(1.025);
      }

      .pts-hover-glow {
        transition: box-shadow 0.25s ease;
      }
      .pts-hover-glow:hover {
        box-shadow: 0 0 24px -4px var(--pts-accent, rgba(109, 94, 252, 0.35));
      }

      .pts-hover-border {
        transition: border-color 0.2s ease;
        border-color: transparent;
      }
      .pts-hover-border:hover {
        border-color: var(--pts-accent, #6d5efc);
      }

      /* ---- Press / tap feedback ---- */
      .pts-press-feedback:active {
        transform: scale(0.97);
        transition: transform 0.08s ease;
      }

      /* ---- Scroll reveal ---- */
      .pts-reveal {
        opacity: 0;
        transition: opacity 0.01s;
      }
      .pts-reveal--visible {
        opacity: 1;
      }

      /* ---- Sticky / floating transition polish ---- */
      .pts-sticky-active {
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        transition: box-shadow 0.3s ease;
      }

      .pts-floating-enter {
        animation: pts-floating-fade-in 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes pts-floating-fade-in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .pts-anim-fade,
        .pts-anim-slide,
        .pts-anim-scale,
        .pts-anim-rise,
        .pts-anim-slide-up,
        .pts-anim-scale-in,
        .pts-hoverable,
        .pts-hover-lift,
        .pts-hover-scale,
        .pts-hover-glow,
        .pts-hover-border,
        .pts-press-feedback,
        .pts-floating-enter {
          animation: none !important;
          transition: none !important;
          transform: none !important;
        }
        .pts-reveal {
          opacity: 1 !important;
        }
      }

      /* ------------------------------------------------------------------ */
      /* Official gold verification badge — metallic shimmer (reduced-motion  */
      /* aware). The highlight sweeps once per cycle then pauses, so it reads */
      /* as polished metal catching light rather than a flashing animation.   */
      /* ------------------------------------------------------------------ */
      .pts-official-gold {
        border-radius: 999px;
      }

      .pts-gold-shimmer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        border-radius: 999px;
        background: linear-gradient(
          115deg,
          transparent 35%,
          rgba(255, 255, 255, 0.7) 50%,
          transparent 65%
        );
        background-size: 250% 100%;
        background-position: 130% 0;
        mix-blend-mode: overlay;
        animation: pts-gold-shimmer-sweep 4500ms ease-in-out infinite;
      }

      @keyframes pts-gold-shimmer-sweep {
        0% {
          background-position: 130% 0;
          opacity: 0;
        }
        8% {
          opacity: 1;
        }
        32% {
          background-position: -130% 0;
          opacity: 1;
        }
        38% {
          opacity: 0;
        }
        100% {
          background-position: -130% 0;
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .pts-gold-shimmer {
          animation: none !important;
          opacity: 0 !important;
        }
      }

      /* ===================================================================== */
      /* Phase 1 — Approved Lovable visual tokens + Power Editor shell frame.   */
      /* Scoped to `.pts-scope` (Power Editor only). Does NOT touch the global   */
      /* theme, Basic Editor, or PlatformNavbar. The page surface (`.pts-page`) */
      /* re-establishes the host light theme below so the document stays bright  */
      /* while the surrounding editor chrome is dark.                            */
      /* ===================================================================== */

      .pts-scope {
        /* Lovable-approved editor-local tokens (source: Visual Canvas styles.css) */
        --ed-bg: oklch(0.19 0.012 265);
        --ed-chrome: oklch(0.235 0.014 265);
        --ed-chrome-2: oklch(0.275 0.016 265);
        --ed-elevated: oklch(0.31 0.018 265);
        --ed-line: oklch(1 0 0 / 9%);
        --ed-line-strong: oklch(1 0 0 / 18%);
        --ed-text: oklch(0.965 0.004 265);
        --ed-muted: oklch(0.68 0.018 265);
        --ed-faint: oklch(0.53 0.018 265);
        --ed-accent: oklch(0.82 0.18 172);
        --ed-accent-ink: oklch(0.22 0.05 172);
        --ed-select: oklch(0.74 0.16 250);
        --ed-warn: oklch(0.83 0.16 85);
        --ed-canvas: oklch(0.14 0.01 265);
        --ed-page: oklch(0.995 0.002 90);
        --ed-page-ink: oklch(0.22 0.02 265);
        --ed-shadow: 0 24px 60px -20px oklch(0 0 0 / 65%);

        /* Re-map host Tailwind semantic tokens → dark immersive editor values.
   * Existing utilities (bg-card, bg-background, border-border, text-foreground,
   * text-muted-foreground, bg-muted, hover:bg-accent, …) resolve to these
   * within the editor, so no component or className needs to move. */
        --background: var(--ed-bg);
        --foreground: var(--ed-text);
        --card: var(--ed-chrome);
        --card-foreground: var(--ed-text);
        --popover: var(--ed-elevated);
        --popover-foreground: var(--ed-text);
        --primary: var(--ed-accent);
        --primary-foreground: var(--ed-accent-ink);
        --secondary: var(--ed-chrome-2);
        --secondary-foreground: var(--ed-text);
        --muted: var(--ed-chrome-2);
        --muted-foreground: var(--ed-muted);
        --accent: var(--ed-chrome-2);
        --accent-foreground: var(--ed-text);
        --destructive: oklch(0.704 0.191 22.216);
        --destructive-foreground: oklch(0.984 0.003 247.858);
        --border: var(--ed-line);
        --input: var(--ed-line-strong);
        --ring: var(--ed-select);
      }

      /* The document surface stays bright. Re-establish the host light theme on
 * the page so TemplateRenderer / ProfileHeader / blocks / avatar are visually
 * unchanged by the dark chrome. (Renderer is FROZEN — presentation only.) */
      .pts-scope .pts-page {
        --background: oklch(1 0 0);
        --foreground: oklch(0.129 0.042 264.695);
        --card: oklch(1 0 0);
        --card-foreground: oklch(0.129 0.042 264.695);
        --popover: oklch(1 0 0);
        --popover-foreground: oklch(0.129 0.042 264.695);
        --primary: oklch(0.208 0.042 265.755);
        --primary-foreground: oklch(0.984 0.003 247.858);
        --secondary: oklch(0.968 0.007 247.896);
        --secondary-foreground: oklch(0.208 0.042 265.755);
        --muted: oklch(0.968 0.007 247.896);
        --muted-foreground: oklch(0.554 0.046 257.417);
        --accent: oklch(0.968 0.007 247.896);
        --accent-foreground: oklch(0.208 0.042 265.755);
        --destructive: oklch(0.577 0.245 27.325);
        --destructive-foreground: oklch(0.984 0.003 247.858);
        --border: oklch(0.929 0.013 255.508);
        --input: oklch(0.929 0.013 255.508);
        --ring: oklch(0.704 0.04 256.788);
      }

      /* Canvas surround — neutral dark backdrop with the approved grid. This only
 * recolors the frozen `.pts-power-viewport` scroll surface; camera, pan, and
 * zoom behavior are untouched. */
      .pts-scope .pts-power-viewport {
        background-color: var(--ed-canvas);
        background-image:
          linear-gradient(to right, oklch(1 0 0 / 4%) 1px, transparent 1px),
          linear-gradient(to bottom, oklch(1 0 0 / 4%) 1px, transparent 1px);
        background-size: 32px 32px;
      }
    </style>
  </head>
